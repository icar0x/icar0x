name: Atualizar Breakout de contribuições

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: profile-breakout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gerar Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: breakout
      - name: Publicar animação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/breakout-contribution-graph.svg dist/breakout-contribution-graph-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza animação das contribuições"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
